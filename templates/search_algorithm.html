<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search and Sort</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <script>
        const selectedAlgorithm = {{ algorithm_name | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>

<body>
    <div class="card shadow title-card">
        <h1>{{ display_name }}</h1>
    </div>
    <div class="card shadow small-card">
        <form action="/search" method="POST" id="search-form" class="file-text">
            <input type="search" id="site-search" name="search-term" placeholder="Enter an item to search for" required/>
            <label for="data-type">Data type:</label>
            <select id="data-type" name="data_type">
                <option value="integer">Numbers (integers)</option>
                <option value="string">Text (strings)</option>
            </select>
            <button type="submit">Search</button>
        </form>
        <p id="search-result" aria-live="polite"></p>
    </div>
</body>
