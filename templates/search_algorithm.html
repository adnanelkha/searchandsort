<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search and Sort</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>

<body>
    <div class="card shadow title-card">
        <h1>{{ display_name }}</h1>
    </div>
    <div class="card shadow small-card">
        <form action="/search" method="POST" id="search-form">
            <input type="search" id="site-search" name="search-term" placeholder="Enter an item to search for" required/>
            <button type="submit">Search</button>
        </form>
        <p id="search-result" aria-live="polite"></p>
    </div>
</body>
