<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search and Sort</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>

<body>
    <div class="card shadow title-card">
        <h1>Search and Sort</h1>
    </div>
    <div class="card shadow large-card">
        <div id="drag-and-drop" class="drag-and-drop">
    		Drop files here
		</div>
		<p class="file-text">
    		Selected file: <span id="myText">None</span>
		</p>
    </div>
    <div class="card shadow small-card">
        <select name="searches" id="search select">
            <option value="">Select an algorithm</option>
            <hr />
            <optgroup label="Searches">
                <option value="binary">Binary</option>
                <option value="linear">Linear</option>
            </optgroup>
            <hr />
            <optgroup label="Sorts">
                <option value="bubble">Bubble</option>
                <option value="insertion">Insertion</option>
                <option value="merge">Merge</option>
                <option value="quick">quick</option>
            </optgroup>
        </select>
    </div>
</body>
</html>
