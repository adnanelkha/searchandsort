<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Search and Sort</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" type="image/png" href="/images/favicon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
</head>

<body>
	<div class="card shadow title-card">
		<h1>Search and Sort</h1>
	</div>
	<div class="card shadow large-card">
		<label id="drag-and-drop">
			Drop files here
			<input type="file" id="file-input" accept=".csv,text/csv"/> <!-- make it so it can only accept csv files -->
		</label>
	<div class = "clear-button">
		<button id="clear-button">Clear</button>
	</div>
</body>

</html>
